name: Verify reproducibility companion

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.13'
          - os: windows-latest
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install frozen analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify artifact hashes and manuscript claims
        run: python scripts/verify_results.py --export-tables
      - name: Run synthetic methodological tests
        run: python -m unittest discover -s tests -v
